name: Part 2 readiness

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - completed-sections1-2-3.md

permissions:
  contents: write

concurrency:
  group: part2-readiness-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  archive-completed-setup:
    if: github.event.head_commit.message == 'initialize GitHub Agentic Workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Archive completed sections
        shell: bash
        run: |
          set -euo pipefail

          archive_file="completed-sections1-2-3.md"
          section_heading="## 4. Add and Run the Daily Repo Status Workflow"
          completion_heading="# 🎉 CONGRATULATIONS FOR MAKING IT THIS FAR!!! 🚀🥳"
          first_line="$(head -n 1 README.md)"

          if [[ "$first_line" == "$completion_heading" ]]; then
            if [[ ! -f "$archive_file" ]] ||
               [[ ! -s "$archive_file" ]] ||
               ! grep -qF "## 3. Install and Initialize \`gh-aw\`" "$archive_file" ||
               grep -qF "$section_heading" "$archive_file"; then
              echo "::error::README.md has transitioned to part 2, but its archive is missing or invalid."
              exit 1
            fi

            mapfile -t completed_section_matches < <(grep -nF "$section_heading" README.md || true)
            if (( ${#completed_section_matches[@]} != 1 )); then
              echo "::error::The part 2 README must contain exactly one section 4 heading."
              exit 1
            fi

            echo "The workshop is already ready for part 2."
            exit 0
          fi

          mapfile -t section_matches < <(grep -nF "$section_heading" README.md || true)
          if (( ${#section_matches[@]} != 1 )); then
            echo "::error::Expected exactly one section 4 heading in README.md; found ${#section_matches[@]}."
            exit 1
          fi

          section_line="${section_matches[0]%%:*}"
          if (( section_line <= 1 )); then
            echo "::error::README.md does not contain any sections to archive."
            exit 1
          fi

          archive_temp="$(mktemp .completed-sections1-2-3.md.XXXXXX)"
          readme_temp="$(mktemp .README.md.XXXXXX)"
          trap 'rm -f "$archive_temp" "$readme_temp"' EXIT

          head -n "$((section_line - 1))" README.md > "$archive_temp"

          printf '%s\n' \
            '# 🎉 CONGRATULATIONS FOR MAKING IT THIS FAR!!! 🚀🥳' \
            '' \
            "## NOW IT'S TIME FOR THE MOST FUN PART! 🤖✨" \
            '' \
            'Need to revisit setup? Review the' \
            '[completed sections 1–3](completed-sections1-2-3.md).' \
            '' > "$readme_temp"
          tail -n "+$section_line" README.md >> "$readme_temp"

          if [[ ! -s "$archive_temp" ]] || ! grep -qF "## 3. Install and Initialize \`gh-aw\`" "$archive_temp"; then
            echo "::error::The generated archive is incomplete."
            exit 1
          fi

          if grep -qF "$section_heading" "$archive_temp"; then
            echo "::error::The generated archive unexpectedly contains section 4."
            exit 1
          fi

          if [[ "$(head -n 1 "$readme_temp")" != "$completion_heading" ]] ||
             [[ "$(grep -cF "$section_heading" "$readme_temp")" -ne 1 ]]; then
            echo "::error::The generated part 2 README is invalid."
            exit 1
          fi

          if [[ -e "$archive_file" ]]; then
            if [[ ! -f "$archive_file" ]] || ! cmp -s "$archive_temp" "$archive_file"; then
              echo "::error::$archive_file conflicts with the archive generated from README.md."
              exit 1
            fi

            rm -f "$archive_temp"
          else
            mv "$archive_temp" "$archive_file"
          fi

          mv "$readme_temp" README.md
          trap - EXIT

      - name: Commit the workshop transition
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md completed-sections1-2-3.md

          if git diff --cached --quiet -- README.md completed-sections1-2-3.md; then
            echo "No workshop transition changes to commit."
            exit 0
          fi

          git commit -m "advance workshop to section 4"
          git push origin HEAD:main
